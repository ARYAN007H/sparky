# Local-development bridge that links module implementation crates into a host
# executable and registers them with the core's `register_linked` seam
# (`openhuman_rpc::embed::modules`), so `[modules] source = "linked"` serves a
# module from the running binary instead of a downloaded release.
#
# This is the ONLY crate allowed to depend on module implementation crates
# (`scripts/ci/module-boundaries.json`), and the only crate allowed to depend on
# it is `openhuman-cli`, as an optional dependency behind the non-product
# `linked-modules` feature (`scripts/ci/check-crate-chain.mjs`). The desktop
# app, the TUI and the core never reach it, and `linked-modules` is in no
# product feature set (`scripts/ci/check-feature-forwarding.mjs`). CI and
# shipped builds load pinned, digest-checked releases.
#
# One feature per module, named for its registry id, plus `all`. At the current
# vendor pins a module can be linked only when its crate exposes `static-link`
# with an exported `linked_module` AND resolves against the workspace `tinybus`
# (0.1.3). These WAIT for the upstream E0.3 work and a re-pin; they have no
# feature here yet (reasons in `src/lib.rs`):
#   tinybox, tinyconnectors, tinyvoice, tinymcp, tinycomputer, tinyjuice,
#   tinysearch, tinywallet, tinyhosts.

[package]
name = "openhuman-modules-linked"
description = "Local-development registration of in-process linked modules (never part of a product build)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
all = ["tinychannels", "tinydocs"]
tinychannels = ["dep:tinychannels-module"]
tinydocs = ["dep:tinydocs-module"]

[dependencies]
# The host reaches the core only through the rpc facade (crate chain).
openhuman-rpc = { path = "../openhuman-rpc", default-features = false, features = ["modules"] }
log = "0.4"

tinydocs-module = { path = "../../vendor/tinydocs/crates/tinydocs-module", features = ["static-link"], optional = true }
tinychannels-module = { path = "../../vendor/tinychannels/crates/tinychannels-module", features = ["static-link"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
